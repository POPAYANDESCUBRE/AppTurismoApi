components:
  schemas:
    Alojamiento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
        direccion:
          type: string
          maxLength: 200
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        imagen:
          type: string
          format: uri
          nullable: true
        hora_apertura:
          type: string
          format: time
          nullable: true
        hora_cierre:
          type: string
          format: time
          nullable: true
        tipo_alojamiento:
          type: integer
          nullable: true
        tipo_habitacion:
          type: integer
          nullable: true
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        capacidad_personas:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        telefono:
          type: string
          maxLength: 20
        sitio_web:
          type: string
          format: uri
          maxLength: 200
        rating_avg:
          type: number
          format: double
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        es_destacado:
          type: boolean
        is_favorito:
          type: string
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
        estado:
          type: boolean
          readOnly: true
      required:
      - descripcion
      - direccion
      - estado
      - fecha_actualizacion
      - fecha_creacion
      - id
      - is_favorito
      - latitud
      - longitud
      - nombre
      - precio
      - rating_avg
      - rating_count
    BlankEnum:
      enum:
      - ''
    CategoriaEnum:
      enum:
      - eventos
      - alertas
      - consejos
      - cultura
      type: string
      description: |-
        * `eventos` - Eventos
        * `alertas` - Alertas
        * `consejos` - Consejos
        * `cultura` - Cultura
    CategoriaMenu:
      type: object
