[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["pip install --break-system-packages -r requirements.txt"]

[phases.build]
cmds = [
  "DJANGO_SETTINGS_MODULE=core.settings.railway DJANGO_SECRET_KEY=build-time-secret DATABASE_URL=sqlite:///tmp/build.db python manage.py collectstatic --noinput"
]

# Eliminar el release phase - Railway ejecutará migrate desde Procfile en runtime
# cuando las variables de entorno estén disponibles

[start]
cmd = "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
